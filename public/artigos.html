<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Artigos · Ímpar</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  :root{
    --blue:#0C35C3;
    --blue-deep:#082AAF;
    --blue-light:#EBEEFA;
    --ink-soft:rgba(12,53,195,.7);
    --rule:rgba(12,53,195,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"PP Telegraf",system-ui,sans-serif;
    background:#fff;color:var(--blue);
    font-size:17px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1320px;margin:0 auto;padding:0 72px}

  /* ── TOP BAR ── */
  .top-bar{
    position:sticky;top:0;z-index:50;
    background:#fff;border-bottom:1px solid var(--rule);
  }
  .top-bar .inner{
    display:flex;align-items:center;justify-content:space-between;
    height:64px;
  }
  .logo-img{height:24px;width:auto;display:block}
  .back-link{
    font-size:13px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-soft);display:flex;align-items:center;gap:7px;
    transition:color .15s;
  }
  .back-link:hover{color:var(--blue)}

  /* ── PAGE HEADER ── */
  .page-head{
    background:var(--blue-light);
    padding:72px 0 0;
  }
  .page-eyebrow{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:16px;
  }
  .page-head h1{
    font-weight:400;
    font-size:clamp(52px,8.5vw,120px);
    line-height:.88;letter-spacing:-0.036em;
    text-transform:uppercase;
    margin:0 0 22px;
  }
  .page-sub{
    max-width:50ch;font-size:17px;line-height:1.6;
    color:var(--ink-soft);margin:0;
  }

  /* ── TAG STRIP ── */
  .tag-strip{
    display:flex;gap:8px;align-items:center;
    overflow-x:auto;
    scrollbar-width:none;-ms-overflow-style:none;
    padding:24px 0 28px;
    margin-top:32px;
    border-top:1px solid var(--rule);
  }
  .tag-strip::-webkit-scrollbar{display:none}
  .tag-chip{
    flex-shrink:0;
    display:inline-flex;align-items:center;
    background:#fff;color:var(--blue);
    border:1px solid var(--rule);border-radius:999px;
    padding:7px 18px 8px;
    font-family:inherit;font-size:12px;font-weight:400;
    letter-spacing:.07em;text-transform:uppercase;
    cursor:pointer;white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tag-chip:hover{background:rgba(12,53,195,.07);border-color:rgba(12,53,195,.5)}
  .tag-chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}

  /* ── ARTICLES AREA ── */
  .articles-wrap{padding:64px 0 100px}

  /* ── FEATURED ARTICLE ── */
  .article-featured{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:56px;
    align-items:center;
    padding-bottom:64px;
    margin-bottom:64px;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
  }
  .article-featured .feat-thumb{
    aspect-ratio:4/3;
    background-color:var(--blue-light);
    background-image:repeating-linear-gradient(135deg,rgba(12,53,195,.12) 0 2px,transparent 2px 10px);
    background-size:cover;background-position:center;
    border:1px solid rgba(12,53,195,.2);
    overflow:hidden;
    transition:transform .35s ease;
  }
  .article-featured:hover .feat-thumb{transform:scale(1.015)}
  .article-featured .feat-body{display:flex;flex-direction:column;gap:0}
  .feat-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
  .feat-tags .cat,
  .article .thumb .cat{
    font-family:"PP Telegraf",sans-serif;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    background:var(--blue);color:#fff;
    padding:5px 10px;
  }
  .article-featured h2{
    font-weight:400;
    font-size:clamp(26px,3vw,50px);
    line-height:1.02;letter-spacing:-0.022em;
    text-transform:uppercase;margin:0 0 24px;
  }
  .article-featured .feat-meta{
    display:flex;gap:16px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .feat-cta{
    display:inline-flex;align-items:center;gap:8px;
    margin-top:28px;
    font-size:13px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;
    color:var(--blue);
    border-bottom:1px solid var(--blue);
    padding-bottom:2px;
    width:fit-content;
  }

  /* ── GRID ── */
  .content-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:28px;
  }
  .article{
    display:flex;flex-direction:column;gap:16px;
    cursor:pointer;
  }
  .article .thumb{
    aspect-ratio:4/3;
    background-color:var(--blue-light);
    background-image:repeating-linear-gradient(135deg,rgba(12,53,195,.12) 0 2px,transparent 2px 10px);
    background-size:cover;background-position:center;
    border:1px solid rgba(12,53,195,.2);
    position:relative;
    display:flex;align-items:flex-start;padding:14px;
    transition:transform .25s ease;
  }
  .article:hover .thumb{transform:translateY(-4px)}
  .article h3{
    font-weight:400;
    font-size:20px;line-height:1.06;letter-spacing:-0.015em;
    text-transform:uppercase;margin:0;
  }
  .article .meta{
    display:flex;gap:14px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ── EMPTY / LOADING ── */
  .state{
    padding:80px 0;text-align:center;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ── FOOTER ── */
  .site-foot{
    background:var(--blue-light);
    border-top:1px solid var(--rule);
    padding:28px 0;
  }
  .site-foot .inner{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .site-foot a{color:var(--ink-soft);transition:color .15s}
  .site-foot a:hover{color:var(--blue)}

  /* ── RESPONSIVE ── */
  @media(max-width:980px){
    .article-featured{grid-template-columns:1fr;gap:28px;align-items:start}
    .article-featured .feat-thumb{aspect-ratio:16/9}
    .content-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:600px){
    .wrap{padding:0 20px}
    .page-head h1{font-size:clamp(44px,14vw,80px)}
    .content-grid{grid-template-columns:1fr}
    .article-featured h2{font-size:clamp(22px,8vw,40px)}
    .articles-wrap{padding:40px 0 72px}
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<nav class="top-bar">
  <div class="wrap inner">
    <a href="/" aria-label="Ímpar">
      <img src="/assets/logo-top-bar.svg" alt="Ímpar" class="logo-img" />
    </a>
    <a href="/" class="back-link">
      <span aria-hidden="true">←</span>
      <span>Início</span>
    </a>
  </div>
</nav>

<!-- PAGE HEADER -->
<header class="page-head">
  <div class="wrap">
    <p class="page-eyebrow">Ímpar · Comunicação &amp; Reputação</p>
    <h1>Artigos</h1>
    <p class="page-sub">Reputação, comunicação e tendências. Publicações curtas e ensaios assinados por sócios e parceiros da Ímpar.</p>
    <div class="tag-strip" id="tag-strip" role="group" aria-label="Filtrar por tag"></div>
  </div>
</header>

<!-- ARTICLES -->
<div class="articles-wrap">
  <div class="wrap">
    <div id="articles-content">
      <div class="state">Carregando…</div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="site-foot">
  <div class="wrap inner">
    <span>Ímpar · Comunicação &amp; Reputação</span>
    <a href="/">← Início</a>
  </div>
</footer>

<script>
const strip   = document.getElementById('tag-strip');
const content = document.getElementById('articles-content');
let allPosts  = [];
let activeTag = 'all';

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function readMins(n){ return ((n||1)+' min'); }

function thumbBg(p){
  return p.image_url ? `background-image:url('${esc(p.image_url)}')` : '';
}

function collectTags(posts){
  const seen = new Set();
  posts.forEach(p=>(Array.isArray(p.tags)?p.tags:[]).forEach(t=>{ if(t) seen.add(t); }));
  return [...seen];
}

function buildStrip(tags){
  const chips = ['all',...tags].map(t=>`
    <button class="tag-chip${(t===activeTag||(t==='all'&&activeTag==='all'))?' active':''}" data-tag="${esc(t)}">
      ${t==='all'?'Todas':esc(t)}
    </button>`).join('');
  strip.innerHTML = chips;
  strip.querySelectorAll('.tag-chip').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeTag = btn.dataset.tag;
      strip.querySelectorAll('.tag-chip').forEach(b=>b.classList.toggle('active',b===btn));
      render();
    });
  });
}

function visible(){
  if(activeTag==='all') return allPosts;
  return allPosts.filter(p=>(Array.isArray(p.tags)?p.tags:[]).includes(activeTag));
}

function featuredHtml(p){
  const tags = Array.isArray(p.tags)?p.tags:[];
  const tagChips = tags.map(t=>`<span class="cat">${esc(t)}</span>`).join('');
  return `
    <a class="article-featured" href="/article.html?id=${esc(p.id)}">
      <div class="feat-thumb" style="${thumbBg(p)}"></div>
      <div class="feat-body">
        ${tags.length?`<div class="feat-tags">${tagChips}</div>`:''}
        <h2>${esc(p.title||'Sem título')}</h2>
        <div class="feat-meta">
          <span>${esc(readMins(p.read_minutes))}</span>
        </div>
        <span class="feat-cta">Ler artigo <span aria-hidden="true">→</span></span>
      </div>
    </a>`;
}

function gridHtml(posts){
  if(!posts.length) return '';
  return `<div class="content-grid">${posts.map(p=>{
    const tags = Array.isArray(p.tags)?p.tags:[];
    const cat  = tags[0]||'';
    return `
      <a class="article" href="/article.html?id=${esc(p.id)}">
        <div class="thumb" style="${thumbBg(p)}">
          ${cat?`<span class="cat">${esc(cat)}</span>`:''}
        </div>
        <h3>${esc(p.title||'Sem título')}</h3>
        <div class="meta"><span>${esc(readMins(p.read_minutes))}</span></div>
      </a>`;
  }).join('')}</div>`;
}

function render(){
  const list = visible();
  if(!list.length){
    content.innerHTML = `<div class="state">Nenhum artigo${activeTag!=='all'?' com esta tag':' publicado'} ainda.</div>`;
    return;
  }
  const [first,...rest] = list;
  content.innerHTML = featuredHtml(first) + (rest.length ? gridHtml(rest) : '');
}

fetch('/api/posts?limit=200',{headers:{accept:'application/json'}})
  .then(r=>r.ok?r.json():null)
  .then(d=>{
    if(!d?.posts){ content.innerHTML='<div class="state">Erro ao carregar artigos.</div>'; return; }
    allPosts = d.posts;
    buildStrip(collectTags(allPosts));
    render();
  })
  .catch(()=>{ content.innerHTML='<div class="state">Erro ao carregar artigos.</div>'; });
</script>
</body>
</html>
