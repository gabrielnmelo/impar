<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ímpar — Artigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1a1aff;
    --blue-deep:#1010c9;
    --blue-soft:rgba(26,26,255,.7);
    --rule:rgba(26,26,255,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Space Grotesk",system-ui,sans-serif;
    background:#fff;
    color:var(--blue);
    font-size:17px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1320px;margin:0 auto;padding:0 32px}

  /* ── STICKY TOP BAR ── */
  nav.article-top{
    position:fixed;top:0;left:0;right:0;z-index:60;
    background:#fff;
    border-bottom:1px solid var(--rule);
    transform:translateY(-100%);
    transition:transform .35s cubic-bezier(.22,.61,.36,1);
    pointer-events:none;
  }
  nav.article-top.is-visible{
    transform:translateY(0);
    pointer-events:auto;
  }
  nav.article-top .row{
    display:flex;align-items:center;justify-content:space-between;
    height:64px;gap:24px;
  }
  nav.article-top .left{
    display:flex;align-items:center;gap:18px;min-width:0;
  }
  nav.article-top .logo-img{height:22px;width:auto;display:block;flex-shrink:0;}
  nav.article-top .divider{
    width:1px;height:22px;background:var(--rule);flex-shrink:0;
  }
  nav.article-top .article-title{
    font-family:"Space Grotesk",sans-serif;font-weight:600;
    font-size:14px;letter-spacing:-0.005em;color:var(--blue);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  }
  nav.article-top .back{
    display:inline-flex;align-items:center;gap:8px;
    font-family:"Space Grotesk",sans-serif;font-weight:600;
    font-size:13px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--blue);border:1px solid var(--blue);
    padding:9px 16px 10px;border-radius:999px;flex-shrink:0;
    transition:background .15s ease,color .15s ease;
  }
  nav.article-top .back:hover{background:var(--blue);color:#fff;}

  /* ── HERO ── */
  .article-hero{
    position:relative;width:100%;height:100vh;min-height:560px;
    overflow:hidden;background:#0c0c1a;color:#fff;isolation:isolate;
  }
  .article-hero .bg{
    position:absolute;inset:0;
    background-position:center;background-size:cover;background-repeat:no-repeat;
    z-index:0;
  }
  .article-hero .gradient{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0) 40%,
      rgba(0,0,0,.18) 70%,
      rgba(0,0,0,.40) 100%
    );
    pointer-events:none;
  }
  .article-hero .hero-nav{
    position:absolute;top:0;left:0;right:0;z-index:5;
  }
  .article-hero .hero-nav .row{
    display:flex;align-items:center;justify-content:space-between;height:72px;
  }
  .article-hero .hero-nav .logo-img{height:26px;width:auto;display:block;}
  .article-hero .hero-nav .back-light{
    display:inline-flex;align-items:center;gap:8px;
    font-family:"Space Grotesk",sans-serif;font-weight:600;
    font-size:13px;letter-spacing:.04em;text-transform:uppercase;
    color:#fff;border:1px solid rgba(255,255,255,.8);
    padding:9px 16px 10px;border-radius:999px;
    transition:background .15s ease,color .15s ease;
  }
  .article-hero .hero-nav .back-light:hover{background:#fff;color:var(--blue);}
  .article-hero .hero-content{
    position:absolute;left:0;right:0;bottom:0;z-index:3;
    padding:64px 0 80px;
  }
  .article-hero .hero-inner{max-width:656px;}
  .article-hero .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-family:"Space Grotesk",sans-serif;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(255,255,255,.85);margin-bottom:24px;
  }
  .article-hero .eyebrow .cat{
    background:var(--blue);color:#fff;
    padding:5px 11px 6px;letter-spacing:.14em;font-weight:500;
  }
  .article-hero h1{
    font-family:"Space Grotesk",sans-serif;font-weight:600;
    font-size:clamp(40px,5.4vw,76px);line-height:1.02;
    letter-spacing:-0.028em;margin:0;color:#fff;text-wrap:balance;
  }
  .article-hero .art-subtitle{
    margin:16px 0 0;
    font-family:"Space Grotesk",sans-serif;font-weight:400;
    font-size:clamp(18px,1.6vw,22px);line-height:1.45;
    letter-spacing:-0.005em;color:rgba(255,255,255,.85);
    text-wrap:pretty;max-width:560px;
  }
  .article-hero .meta{
    margin-top:32px;display:flex;gap:24px;
    font-family:"Space Grotesk",sans-serif;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(255,255,255,.75);
  }
  .scroll-hint{
    position:absolute;right:32px;bottom:80px;z-index:4;
    display:flex;align-items:center;gap:10px;
    color:rgba(255,255,255,.8);font-family:"Space Grotesk",sans-serif;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    pointer-events:none;
  }
  .scroll-hint .arrow{width:14px;height:14px;animation:bob 2.2s ease-in-out infinite;}
  @keyframes bob{
    0%,100%{transform:translateY(0);opacity:.6}
    50%{transform:translateY(4px);opacity:1}
  }

  /* ── ARTICLE BODY ── */
  .article-body{
    background:#fff;color:var(--blue);
    padding:96px 0 64px;border-bottom:1px solid var(--rule);
  }
  .body-inner{max-width:720px;margin:0 auto;padding:0 32px;}
  .body-inner .lede{
    font-family:"Space Grotesk",sans-serif;font-weight:500;
    font-size:clamp(22px,1.8vw,26px);line-height:1.35;
    letter-spacing:-0.008em;color:var(--blue);
    margin:0 0 48px;text-wrap:pretty;
  }
  .body-inner p{font-size:18px;line-height:1.62;color:var(--blue);margin:0 0 24px;}
  .body-inner h2{
    font-family:"Space Grotesk",sans-serif;font-weight:600;
    font-size:clamp(28px,2.4vw,36px);letter-spacing:-0.02em;line-height:1.1;
    margin:56px 0 20px;color:var(--blue);
  }
  .body-inner blockquote{
    margin:48px 0;padding:24px 0 24px 28px;
    border-left:2px solid var(--blue);
    font-family:"Space Grotesk",sans-serif;font-weight:500;
    font-size:clamp(22px,2vw,28px);line-height:1.25;
    letter-spacing:-0.015em;color:var(--blue);
  }
  .body-inner img{max-width:100%;height:auto;display:block;margin:32px 0;}
  .body-inner .author-line{
    margin-top:64px;padding-top:24px;border-top:1px solid var(--rule);
    font-family:"Space Grotesk",sans-serif;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--blue-soft);display:flex;justify-content:space-between;gap:24px;
  }

  /* loading / error */
  .body-inner .loading{
    padding:64px 0;text-align:center;color:var(--blue-soft);
    font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  }

  /* ── FOOTER ── */
  .article-foot{
    background:#fff;color:var(--blue);padding:64px 0 96px;text-align:center;
  }
  .article-foot a{
    display:inline-flex;align-items:center;gap:10px;
    border:1px solid var(--blue);padding:14px 22px 15px;border-radius:999px;
    font-family:"Space Grotesk",sans-serif;font-weight:600;
    font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);
    transition:background .15s ease,color .15s ease;
  }
  .article-foot a:hover{background:var(--blue);color:#fff;}

  /* ── RESPONSIVE ── */
  @media (max-width:720px){
    .article-hero{min-height:520px;}
    .article-hero .hero-content{padding:48px 0 56px;}
    .article-hero .meta{flex-wrap:wrap;gap:14px;}
    .article-body{padding:64px 0 48px;}
    .scroll-hint{right:16px;bottom:56px;}
    nav.article-top .article-title{font-size:13px;}
    nav.article-top .back .label{display:none;}
  }
</style>
</head>
<body>

<!-- STICKY BAR -->
<nav class="article-top" id="article-top" aria-hidden="true">
  <div class="wrap row">
    <div class="left">
      <a href="/" aria-label="Ímpar — início">
        <img src="/assets/logo-top-bar.svg" alt="Ímpar" class="logo-img" />
      </a>
      <span class="divider" aria-hidden="true"></span>
      <span class="article-title" id="sticky-title"></span>
    </div>
    <a href="/#conteudo" class="back">
      <span aria-hidden="true">←</span>
      <span class="label">Conteúdo</span>
    </a>
  </div>
</nav>

<!-- HERO -->
<header class="article-hero" id="article-hero">
  <div class="bg" id="hero-bg"></div>
  <div class="gradient" aria-hidden="true"></div>

  <nav class="hero-nav">
    <div class="wrap row">
      <a href="/" aria-label="Ímpar — início">
        <img src="/assets/logo-top-bar-white.svg" alt="Ímpar" class="logo-img" />
      </a>
      <a href="/#conteudo" class="back-light">
        <span aria-hidden="true">←</span>
        <span>Conteúdo</span>
      </a>
    </div>
  </nav>

  <div class="hero-content">
    <div class="wrap">
      <div class="hero-inner">
        <div class="eyebrow">
          <span class="cat" id="art-cat"></span>
          <span id="art-date"></span>
        </div>
        <h1 id="art-title"></h1>
        <p class="art-subtitle" id="art-subtitle" hidden></p>
        <div class="meta">
          <span id="art-format"></span>
          <span id="art-time"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="scroll-hint" aria-hidden="true">
    <span>Role para ler</span>
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 4v16m0 0l-6-6m6 6l6-6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</header>

<!-- BODY -->
<article class="article-body">
  <div class="body-inner" id="body-inner">
    <p class="loading">Carregando…</p>
  </div>
</article>

<!-- FOOT -->
<section class="article-foot">
  <a href="/#conteudo">
    <span aria-hidden="true">←</span>
    <span>Voltar ao Conteúdo</span>
  </a>
</section>

<script>
/* ── sticky nav ── */
(function(){
  const hero = document.getElementById('article-hero');
  const bar  = document.getElementById('article-top');
  if (!hero || !bar) return;
  let raf = null;
  function update(){
    raf = null;
    const show = hero.getBoundingClientRect().bottom <= 0;
    bar.classList.toggle('is-visible', show);
    bar.setAttribute('aria-hidden', show ? 'false' : 'true');
  }
  function schedule(){ if (raf == null) raf = requestAnimationFrame(update); }
  window.addEventListener('scroll', schedule, { passive:true });
  window.addEventListener('resize', schedule);
  update();
})();

/* ── load post ── */
(function(){
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { showError('Nenhum artigo especificado.'); return; }

  fetch('/api/posts/' + encodeURIComponent(id), { headers:{ accept:'application/json' } })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(({ post }) => render(post))
    .catch(() => showError('Artigo não encontrado.'));

  function set(elId, val){ const el = document.getElementById(elId); if (el && val != null) el.textContent = val; }

  function fmtDate(ms){
    if (!ms) return '';
    return new Date(ms).toLocaleDateString('pt-BR', { day:'numeric', month:'long', year:'numeric' });
  }
  function fmtDateShort(ms){
    if (!ms) return '';
    return new Date(ms).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
  }

  function render(post){
    const tags   = Array.isArray(post.tags) ? post.tags : [];
    const cat    = tags[0] || 'Conteúdo';
    const format = tags[1] || 'Ensaio';
    const mins   = (post.read_minutes || 1) + ' min de leitura';
    const date   = fmtDate(post.published_at);
    const dateShort = fmtDateShort(post.published_at);

    set('art-title',   post.title);
    set('sticky-title', post.title);
    set('art-cat',     cat);
    set('art-date',    date);
    set('art-format',  format);
    set('art-time',    mins);

    const subtitleEl = document.getElementById('art-subtitle');
    if (subtitleEl) {
      if (post.subtitle) { subtitleEl.textContent = post.subtitle; subtitleEl.hidden = false; }
      else { subtitleEl.hidden = true; }
    }

    if (post.title) document.title = 'Ímpar — ' + post.title;

    if (post.image_url) {
      const bg = document.getElementById('hero-bg');
      if (bg) bg.style.backgroundImage = "url('" + post.image_url.replace(/'/g, "%27") + "')";
    }

    renderBody(post.body_html || '', dateShort, post.author_name || '');
  }

  function renderBody(html, dateShort, authorName){
    const inner = document.getElementById('body-inner');
    if (!html.trim()) {
      inner.innerHTML = '<p class="loading">—</p>';
      return;
    }

    // Pull the first <p> out as the styled lede.
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const firstP = doc.querySelector('p');
    let ledeHtml = '';
    if (firstP) {
      ledeHtml = '<p class="lede">' + firstP.innerHTML + '</p>';
      firstP.remove();
    }

    const byline = authorName ? 'Por ' + authorName : 'Por Ímpar';
    const authorHtml = '<div class="author-line">'
      + '<span>Publicado em ' + (dateShort || '—') + '</span>'
      + '<span>' + byline + '</span>'
      + '</div>';

    inner.innerHTML = ledeHtml + doc.body.innerHTML + authorHtml;
  }

  function showError(msg){
    const inner = document.getElementById('body-inner');
    if (inner) inner.innerHTML = '<p class="loading">' + msg + '</p>';
    document.title = 'Ímpar — Artigo';
  }
})();
</script>

</body>
</html>
