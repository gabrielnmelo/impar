<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin · Ímpar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

<header class="admin-top">
  <div class="row">
    <div class="left">
      <a href="/admin/" class="logo"><img src="/assets/Painel-Impar.svg" alt="Ímpar" /></a>
    </div>
    <div class="right">
      <a class="btn-ghost" href="/" target="_blank" rel="noopener">Ver site →</a>
      <button class="btn btn-soft" id="logout-btn">Sair</button>
    </div>
  </div>
</header>

<nav class="subnav">
  <div class="row">
    <a href="/admin/" class="active">Artigos</a>
    <a href="/admin/proposals.html">Propostas</a>
  </div>
</nav>

<main class="shell">
  <div class="page-head">
    <h1>Posts</h1>
    <a class="btn" href="/admin/editor.html"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>Novo post</a>
  </div>

  <div class="tabs" role="tablist">
    <button class="active" data-filter="all">Todos</button>
    <button data-filter="published">Publicados</button>
    <button data-filter="draft">Rascunhos</button>
  </div>

  <div id="list-wrap">
    <div class="empty-state" id="loading">
      <h3>Carregando…</h3>
    </div>
  </div>
</main>

<script type="module">
import { api, loadMe, formatWhen, logout } from '/admin/admin.js';
import { initLogin } from '/admin/login.js';

await initLogin();

document.getElementById('logout-btn').addEventListener('click', logout);

loadMe();

const wrap = document.getElementById('list-wrap');
const tabs = document.querySelectorAll('.tabs button');
let currentFilter = 'all';
let cache = { all: null, published: null, draft: null };

async function refresh() {
  try {
    const [pub, drafts] = await Promise.all([
      api('/api/posts?limit=50&status=published'),
      api('/api/posts?limit=50&status=draft'),
    ]);
    cache.published = pub.posts;
    cache.draft = drafts.posts;
    cache.all = [...drafts.posts, ...pub.posts].sort(
      (a, b) => (b.updated_at || 0) - (a.updated_at || 0)
    );
    render();
  } catch (e) {
    wrap.innerHTML = `<div class="empty-state"><h3>Erro</h3><p>${e.message}</p></div>`;
  }
}

function render() {
  const posts = cache[currentFilter] || [];
  if (!posts.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <h3>Nenhum post ${currentFilter === 'draft' ? 'em rascunho' : currentFilter === 'published' ? 'publicado' : 'ainda'}</h3>
        <p>Comece criando um novo post.</p>
      </div>`;
    return;
  }
  wrap.innerHTML = `<div class="post-list">${posts.map(rowHtml).join('')}</div>`;
  wrap.querySelectorAll('.post-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      window.location.href = `/admin/editor.html?id=${row.dataset.id}`;
    });
  });
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function rowHtml(p) {
  const cat = (p.tags && p.tags[0]) || '';
  const bg = p.image_url
    ? `style="background-image:url('${esc(p.image_url)}'); background-size:cover; background-position:center;"`
    : '';
  const when = p.status === 'published' ? formatWhen(p.published_at) : `Editado ${formatWhen(p.updated_at)}`;
  return `
    <div class="post-row" data-id="${esc(p.id)}">
      <div class="thumb" ${bg}></div>
      <div class="meta-col">
        <div class="title">${esc(p.title)}</div>
        <div class="sub">
          ${cat ? `<span>${esc(cat)}</span>` : ''}
          <span>${esc(when)}</span>
          <span>${p.read_minutes || 1} min</span>
        </div>
      </div>
      <span class="badge ${p.status}">${p.status === 'published' ? 'Publicado' : 'Rascunho'}</span>
      <a class="btn-ghost" href="/admin/editor.html?id=${esc(p.id)}">Editar →</a>
    </div>`;
}

tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(b => b.classList.toggle('active', b === t));
  currentFilter = t.dataset.filter;
  render();
}));

refresh();
</script>

</body>
</html>
